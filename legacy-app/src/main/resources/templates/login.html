<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>Cymbal HK Ops Portal — Login (v1.0)</title>
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css" />
</head>
<body style="background-color: #f2f2f2; padding-top: 60px;">
<div class="container" style="max-width: 420px;">
  <div class="panel panel-default">
    <div class="panel-heading">
      <h3 class="panel-title">Cymbal HK Merchant Settlement Portal (2016)</h3>
    </div>
    <div class="panel-body">
      <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
      <form method="post" action="/login">
        <div class="form-group">
          <label for="username">Operator Username</label>
          <input type="text" class="form-control" id="username" name="username" placeholder="opsadmin" required="required" />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" class="form-control" id="password" name="password" required="required" />
        </div>
        <button type="submit" class="btn btn-primary btn-block">Sign In</button>
      </form>
    </div>
  </div>
</div>
<script src="https://code.jquery.com/jquery-1.12.4.min.js"></script>
</body>
</html>
