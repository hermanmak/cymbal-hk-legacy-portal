# Local demo profile (PostgreSQL compatibility mode without needing a local Postgres VM)
spring.datasource.url=jdbc:h2:mem:cymbal_portal_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.sql.init.mode=always
